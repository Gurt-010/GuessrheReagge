<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Guessrhe Reagge — Cast Receiver</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: #0D0D0D; color: #F5F5F5;
      font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .viewport {
      width: 100vw; height: 100vh;
      display: flex; align-items: center; justify-content: center;
      background: radial-gradient(ellipse at 30% 20%, #067A46 0%, transparent 55%),
                  radial-gradient(ellipse at 70% 80%, #141A14 0%, #0D0D0D 70%);
    }
    .frame {
      width: min(100vw, calc(100vh * 16 / 9));
      height: min(100vh, calc(100vw * 9 / 16));
      padding: 3vh 4vw;
      display: flex; flex-direction: column;
    }
    .header {
      text-align: center; margin-bottom: 2vh;
    }
    .header h1 {
      color: #F1C40F; font-size: clamp(1.2rem, 2.5vw, 2rem);
      letter-spacing: 0.04em;
    }
    .round { color: #F1C40F; font-size: clamp(1rem, 2vw, 1.5rem); margin-top: 0.5vh; }
    .progress-track {
      height: 8px; background: rgba(6,122,70,0.25);
      border-radius: 4px; overflow: hidden; margin: 1.5vh 0 3vh;
    }
    .progress-fill {
      height: 100%; width: 0%;
      background: linear-gradient(90deg, #067A46, #F1C40F);
      border-radius: 4px; transition: width 0.4s ease;
    }
    .content {
      flex: 1; display: flex; align-items: center; justify-content: center;
    }
    .card {
      background: rgba(26,34,26,0.92);
      border: 1px solid rgba(241,196,15,0.25);
      border-radius: 24px;
      padding: 4vh 5vw;
      width: 100%; max-width: 900px;
      text-align: center;
      box-shadow: 0 0 40px rgba(6,122,70,0.2);
    }
    .vinyl-wrap { display: flex; justify-content: center; margin-bottom: 3vh; }
    .vinyl {
      width: clamp(120px, 22vw, 220px);
      height: clamp(120px, 22vw, 220px);
      border-radius: 50%;
      background: radial-gradient(circle at 50% 50%, #222 0%, #111 40%, #000 100%);
      border: 3px solid #333;
      position: relative;
      animation: spin 4s linear infinite;
      animation-play-state: paused;
    }
    .vinyl.playing { animation-play-state: running; }
    .vinyl::after {
      content: ""; position: absolute; inset: 38%;
      border-radius: 50%; background: #F1C40F;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .waveform {
      display: flex; align-items: flex-end; justify-content: center;
      gap: 6px; height: 48px; margin-bottom: 3vh;
    }
    .bar {
      width: 8px; background: #067A46; border-radius: 4px;
      animation: wave 0.8s ease-in-out infinite alternate;
      animation-play-state: paused;
    }
    .waveform.active .bar { animation-play-state: running; }
    .bar:nth-child(1) { height: 20px; animation-delay: 0s; }
    .bar:nth-child(2) { height: 36px; animation-delay: 0.1s; }
    .bar:nth-child(3) { height: 28px; animation-delay: 0.2s; }
    .bar:nth-child(4) { height: 44px; animation-delay: 0.15s; }
    .bar:nth-child(5) { height: 24px; animation-delay: 0.05s; }
    .bar:nth-child(6) { height: 38px; animation-delay: 0.25s; }
    .bar:nth-child(7) { height: 30px; animation-delay: 0.12s; }
    @keyframes wave { from { transform: scaleY(0.5); } to { transform: scaleY(1.2); } }
    .prompt {
      font-size: clamp(1.4rem, 3vw, 2.4rem);
      font-weight: 800; line-height: 1.25; margin-bottom: 1.5vh;
    }
    .status { color: #F1C40F; font-size: clamp(1rem, 2vw, 1.4rem); }
    .track-title {
      font-size: clamp(1.4rem, 3vw, 2.2rem);
      font-weight: 800; margin-bottom: 1vh;
    }
    .track-artist { font-size: clamp(1.1rem, 2.2vw, 1.6rem); opacity: 0.9; }
    .year {
      font-size: clamp(3rem, 8vw, 5rem);
      color: #067A46; font-weight: 900; margin: 2vh 0 1vh;
    }
    .year-label { color: rgba(241,196,15,0.8); font-size: clamp(0.9rem, 1.8vw, 1.2rem); }
    .loading-spinner {
      width: 64px; height: 64px; border: 6px solid rgba(6,122,70,0.25);
      border-top-color: #F1C40F; border-radius: 50%;
      animation: spin 1s linear infinite; margin: 0 auto 2vh;
    }
    .error { color: #C0392B; margin-top: 2vh; font-size: 1.1rem; }
    .waiting {
      color: rgba(245,245,245,0.7); font-size: 1.2rem; text-align: center;
    }
  </style>
</head>
<body>
  <div class="viewport">
    <div class="frame" id="root">
      <div class="waiting">Waiting for game from your phone…</div>
    </div>
  </div>

  <script src="//www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
  <script>
    const NAMESPACE = 'urn:x-cast:com.soundstation.guessrhereagge.gamestate';
    const root = document.getElementById('root');

    function formatRound(state) {
      const labels = state.labels || {};
      if (state.isEndless) {
        return (labels.roundEndless || 'Round %1$d / ∞').replace('%1$d', state.currentRound);
      }
      if (state.totalRounds > 0) {
        return (labels.roundProgress || 'Round %1$d / %2$d')
          .replace('%1$d', state.currentRound)
          .replace('%2$d', state.totalRounds);
      }
      return labels.appTitle || 'Guessrhe Reagge';
    }

    function playbackLabel(state) {
      const map = {
        LOADING: state.labels?.statusLoading,
        PLAYING: state.labels?.statusPlaying,
        PAUSED: state.labels?.statusPaused,
        ERROR: state.labels?.statusError,
        IDLE: state.labels?.statusReady,
        STOPPED: state.labels?.statusReady,
      };
      return map[state.playbackState] || state.labels?.statusReady || '';
    }

    function renderLoading(state) {
      root.innerHTML = `
        <div class="content"><div class="card">
          <div class="loading-spinner"></div>
          <div class="status">${state.labels?.loading || 'Loading…'}</div>
        </div></div>`;
    }

    function renderFinished(state) {
      root.innerHTML = `
        <div class="content"><div class="card">
          <div class="prompt">${state.errorMessage || state.labels?.finished || 'Game finished'}</div>
        </div></div>`;
    }

    function renderPlaying(state) {
      const isPlaying = state.playbackState === 'PLAYING';
      const progress = Math.round((state.progress || 0) * 100);

      if (state.isMetadataRevealed) {
        root.innerHTML = `
          <div class="header"><h1>${state.labels?.appTitle || ''}</h1>
            <div class="round">${formatRound(state)}</div></div>
          <div class="progress-track"><div class="progress-fill" style="width:${progress}%"></div></div>
          <div class="content"><div class="card">
            <div class="track-title">${state.trackTitle || '—'}</div>
            <div class="track-artist">${state.trackArtist || '—'}</div>
            <div class="year">${state.releaseYear || '—'}</div>
            <div class="year-label">${state.labels?.releaseYearLabel || ''}</div>
          </div></div>`;
        return;
      }

      root.innerHTML = `
        <div class="header"><h1>${state.labels?.appTitle || ''}</h1>
          <div class="round">${formatRound(state)}</div></div>
        <div class="progress-track"><div class="progress-fill" style="width:${progress}%"></div></div>
        <div class="content"><div class="card">
          <div class="vinyl-wrap"><div class="vinyl ${isPlaying ? 'playing' : ''}"></div></div>
          <div class="waveform ${isPlaying ? 'active' : ''}">
            <div class="bar"></div><div class="bar"></div><div class="bar"></div>
            <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
          </div>
          <div class="prompt">${state.labels?.guessPrompt || ''}</div>
          <div class="status">${playbackLabel(state)}</div>
          ${state.errorMessage ? `<div class="error">${state.errorMessage}</div>` : ''}
        </div></div>`;
    }

    function renderGame(raw) {
      try {
        const state = typeof raw === 'string' ? JSON.parse(raw) : raw;
        if (state.phase === 'LOADING') return renderLoading(state);
        if (state.phase === 'FINISHED') return renderFinished(state);
        return renderPlaying(state);
      } catch (e) {
        console.error('Render error', e);
      }
    }

    const context = cast.framework.CastReceiverContext.getInstance();
    context.addCustomMessageListener(NAMESPACE, (event) => renderGame(event.data));
    context.start({ disableIdleTimeout: true });
  </script>
</body>
</html>
